[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weasley-trace-replay"
version = "0.1.0"
description = "Offline replay and differential testing for content-free agent traces"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
weasley-trace-replay = "weasley_trace_replay.__main__:main"

[tool.setuptools.packages.find]
include = ["weasley_trace_replay*"]
