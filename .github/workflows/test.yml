name: Offline replay checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check causal graphs and retain a minimized failure in the log
        run: python -m demos.causal_campaign
      - run: python -m unittest discover -s tests -v
      - run: python -m demos.experiment
      - run: python -m weasley_trace_replay replay examples/completed.jsonl
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Validate installed CLI outside the checkout
        run: python scripts/check_installed.py dist
